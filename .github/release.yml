changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "Breaking changes"
      labels:
        - breaking-change
    - title: "Security"
      labels:
        - security
    - title: "Companion projects"
      labels:
        - companion-project
        - project-recovery
    - title: "Documentation"
      labels:
        - documentation
    - title: "Dependencies and automation"
      labels:
        - dependencies
        - github-actions
    - title: "Fixes"
      labels:
        - bug
        - fix
    - title: "Other changes"
      labels:
        - "*"
