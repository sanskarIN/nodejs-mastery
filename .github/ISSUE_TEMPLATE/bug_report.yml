name: Bug report
description: Report a reproducible problem in the public companion code.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "📘 Complete Node.js Full Mastery eBook: https://ramsandesh.gumroad.com"
  - type: input
    id: part
    attributes:
      label: Part/project
      placeholder: part-125
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
