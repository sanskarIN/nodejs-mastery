name: Release Readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run complete release gate
        run: npm run release:check

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: nodejs-mastery-sbom-${{ github.ref_name }}
          path: dist/nodejs-mastery-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Show official book storefront
        run: |
          echo "Node.js Full Mastery: https://ramsandesh.gumroad.com"
